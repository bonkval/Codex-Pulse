<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101113" />
    <title>Codex Pulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card" aria-label="Codex usage">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" role="img">
              <path d="M20 3.5a5.2 5.2 0 0 1 5.2 5.2v5.1l4.4-2.55a5.2 5.2 0 1 1 5.2 9l-4.42 2.55 4.42 2.55a5.2 5.2 0 1 1-5.2 9l-4.4-2.54v5.08a5.2 5.2 0 1 1-10.4 0v-5.08l-4.4 2.54a5.2 5.2 0 1 1-5.2-9l4.42-2.55-4.42-2.55a5.2 5.2 0 1 1 5.2-9l4.4 2.55V8.7A5.2 5.2 0 0 1 20 3.5Z" />
            </svg>
          </div>
          <div>
            <div class="eyebrow">CODEX PULSE</div>
            <div class="subline"><span class="status-dot"></span><span id="connection-label">Syncing usage</span></div>
          </div>
        </div>
        <div class="actions">
          <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh usage" title="Refresh usage">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.3 8.2A6.6 6.6 0 0 0 4.1 6.1L2.5 7.7M2.5 7.7V3.9m0 3.8h3.8M3.7 11.8a6.6 6.6 0 0 0 12.2 2.1l1.6-1.6m0 0v3.8m0-3.8h-3.8" /></svg>
          </button>
          <button id="theme-button" class="icon-button theme-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="sun-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.1" /><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4" /></svg>
            <svg class="moon-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.8 12.8A6.8 6.8 0 0 1 7.2 3.2 6.9 6.9 0 1 0 16.8 12.8Z" /></svg>
          </button>
          <button id="close-button" class="icon-button close-button" type="button" aria-label="Hide Codex Pulse" title="Hide to tray">×</button>
        </div>
      </header>

      <section class="usage-stack">
        <article class="usage-row" data-window="primary">
          <div class="row-heading">
            <div class="row-label"><span class="window-icon clock-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.1" /><path d="M8 4.5v3.7l2.3 1.4" /></svg></span><span>5 hour remaining</span></div>
            <div class="row-value" id="primary-percent">—</div>
          </div>
          <div class="track"><div class="fill fill-primary" id="primary-fill"></div></div>
          <div class="row-meta"><span id="primary-detail">Loading current usage</span><span id="primary-reset">—</span></div>
        </article>

        <article class="usage-row" data-window="secondary">
          <div class="row-heading">
            <div class="row-label"><span class="window-icon calendar-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.3" y="3.6" width="11.4" height="10" rx="1.8" /><path d="M5.2 2.4v3M10.8 2.4v3M2.6 6.6h10.8M5.1 9.2h.1M8 9.2h.1M10.9 9.2h.1M5.1 11.5h.1M8 11.5h.1M10.9 11.5h.1" /></svg></span><span>Weekly remaining</span></div>
            <div class="row-value" id="secondary-percent">—</div>
          </div>
          <div class="track"><div class="fill fill-secondary" id="secondary-fill"></div></div>
          <div class="row-meta"><span id="secondary-detail">Loading current usage</span><span id="secondary-reset">—</span></div>
        </article>
      </section>

      <footer class="footer">
        <span class="updated"><span class="pulse-ring"></span><span id="updated-label">Waiting for Codex</span></span>
        <button id="codex-button" class="text-button" type="button">Open Codex <span>↗</span></button>
      </footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>

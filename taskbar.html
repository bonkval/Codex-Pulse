<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Pulse status</title>
    <link rel="stylesheet" href="taskbar.css" />
  </head>
  <body>
    <button id="taskbar-status" class="taskbar-status" type="button" title="Open Codex Pulse">
      <span class="status-group"><span class="status-label">5h left</span><strong id="primary-value">-</strong></span>
      <span class="status-group"><span class="status-label">Week left</span><strong id="secondary-value">-</strong></span>
      <span class="status-group today-group"><span class="status-label">Today</span><strong id="today-value">-</strong></span>
    </button>
    <script src="taskbar.js"></script>
  </body>
</html>

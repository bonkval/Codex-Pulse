<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Pulse status</title>
    <link rel="stylesheet" href="taskbar.css" />
  </head>
  <body>
    <button id="taskbar-status" class="taskbar-status" type="button" title="Open Codex Pulse">
      <svg class="taskbar-icon" viewBox="0 0 256 256" aria-hidden="true"><rect x="8" y="8" width="240" height="240" rx="58" fill="#f8f7f4" stroke="#d8d6d1" stroke-width="6" /><path fill="#252525" transform="translate(0 -16)" d="M128 42a29 29 0 0 1 29 29v31l28-16a29 29 0 1 1 29 50l-28 16 28 16a29 29 0 1 1-29 50l-28-16v31a29 29 0 1 1-58 0v-31l-28 16a29 29 0 1 1-29-50l28-16-28-16a29 29 0 1 1 29-50l28 16V71a29 29 0 0 1 29-29Z" /></svg>
      <span class="status-group"><span class="status-label">5H</span><strong id="primary-value">-</strong></span>
      <span class="status-group"><span class="status-label">WEEK</span><strong id="secondary-value">-</strong></span>
      <span class="status-group today-group"><span class="status-label">TODAY</span><strong id="today-value">-</strong></span>
      <span id="activity-value" class="activity-value" aria-live="polite">Idle</span>
    </button>
    <script src="taskbar.js"></script>
  </body>
</html>
